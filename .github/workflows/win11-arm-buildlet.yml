# This workflow is triggered by the coordinator via workflow_dispatch.
# It provisions a Windows 11 ARM64 runner and connects back to the
# coordinator as a reverse buildlet.

name: Windows 11 ARM Buildlet

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: 'Unique buildlet instance name assigned by the coordinator'
        required: true
        type: string
      host_type:
        description: 'Host type from the dashboard config'
        required: true
        type: string
      coordinator:
        description: 'Coordinator address (host:port)'
        required: true
        type: string
        default: 'farmer.golang.org:443'

jobs:
  buildlet:
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      GOMOTEID: ${{ inputs.instance_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
  
      - name: Install llvm-mingw toolchain
        shell: pwsh
        run: |
          # Go's CGO on Windows expects a MinGW-compatible C toolchain.
          # The Azure startup.ps1 notes that LUCI builders get compilers
          # via CIPD; for GitHub Actions we download llvm-mingw directly.
          # See: https://github.com/golang/build/blob/master/env/windows-arm64/azure/startup.ps1
          $version = "20250514"
          $archive = "llvm-mingw-${version}-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/${archive}"
          $dest = "C:\llvm-mingw"

          Write-Host "Downloading llvm-mingw from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$archive" -UseBasicParsing
          Write-Host "Extracting to $dest"
          Expand-Archive -Path "$env:TEMP\$archive" -DestinationPath "C:\"
          Rename-Item "C:\llvm-mingw-${version}-ucrt-aarch64" $dest

          # Put llvm-mingw at the front of PATH so its gcc/clang shadow
          # the x86-64 MinGW gcc that ships with Git for Windows.
          echo "$dest\bin" >> $env:GITHUB_PATH
          $env:PATH = "$dest\bin;$env:PATH"

          Write-Host "CC: $(gcc --version 2>&1 | Select-Object -First 1)"
          Write-Host "Target: $(gcc -dumpmachine)"

      - name: Build buildlet from source
        shell: pwsh
        run: |
          go build -o buildlet.exe ./cmd/buildlet/
          Write-Host "Built buildlet.exe from source"

      - name: Run buildlet
        shell: pwsh
        env:
          COORDINATOR: ${{ inputs.coordinator }}
          INSTANCE_NAME: ${{ inputs.instance_name }}
          HOST_TYPE: ${{ inputs.host_type }}
        run: |
          Write-Host "Connecting buildlet to coordinator at $env:COORDINATOR ..."
          Write-Host "Instance: $env:INSTANCE_NAME"
          Write-Host "Host type: $env:HOST_TYPE"

          # Use the Go installed by setup-go as the bootstrap toolchain.
          $env:GOROOT_BOOTSTRAP = (go env GOROOT)
          Write-Host "GOROOT_BOOTSTRAP=$env:GOROOT_BOOTSTRAP"

          # Set dev mode env so buildlet skips TLS verification
          # and uses a dev key (for testing with mock coordinator).
          $env:GO_BUILDER_ENV = "host-go-builder0"

          .\buildlet.exe `
            --coordinator=$env:COORDINATOR `
            --reverse-type=$env:HOST_TYPE `
            --hostname=$env:INSTANCE_NAME `
            -halt=false
